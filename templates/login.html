<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriGuard | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .auth-header p {
            color: #666;
            font-size: 14px;
        }

        .auth-logo {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-leaf"></i>
                </div>
                <h1>AgriGuard</h1>
                <p>AI-Powered Crop Protection</p>
                <!-- Language Toggle -->
                <div style="margin-top:12px;">
                    <button class="lang-toggle-btn" onclick="toggleLanguage()" title="Switch language"
                        style="display:inline-flex;align-items:center;gap:0;background:#f0f0f8;border:2px solid #667eea;border-radius:50px;padding:0;cursor:pointer;font-size:13px;font-weight:600;overflow:hidden;">
                        <span class="lang-en"
                            style="padding:6px 13px;color:#667eea;font-weight:700;opacity:1;transition:all 0.2s;">EN</span>
                        <span style="color:#aaa;font-size:11px;">|</span>
                        <span class="lang-te"
                            style="padding:6px 13px;color:#667eea;font-weight:400;opacity:0.55;transition:all 0.2s;">తె</span>
                    </button>
                </div>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label class="form-label" data-i18n="login_email">Username</label>
                    <input type="text" name="username" class="form-control" data-i18n-placeholder="login_email"
                        placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="login_password">Password</label>
                    <input type="password" name="password" class="form-control" data-i18n-placeholder="login_password"
                        placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 20px;">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="login_btn">Login</span>
                </button>

                <div class="auth-footer">
                    <p><span data-i18n="login_no_acc">Don't have an account?</span> <a href="{{ url_for('signup') }}"
                            data-i18n="login_signup">Sign up</a></p>
                    <p style="margin-top: 10px; font-size: 12px; color: #999;">
                        Demo: admin / admin
                    </p>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="{{ url_for('static', filename='js/translations.js') }}"></script>

</html>
